name: Fetch floorplan from home.dk

on:
  push:
    paths:
      - ".github/workflows/fetch-floorplan.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find and download floorplan
        shell: bash
        run: |
          python - <<'PY'
          import base64, html as htmlmod, json, re, urllib.request
          from pathlib import Path

          listing = "https://home.dk/salg/lejligheder/strandlodsvej-25d-2th-2300-koebenhavn-s/sag-1450004513/"
          req = urllib.request.Request(listing, headers={"User-Agent":"Mozilla/5.0"})
          page = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          page = htmlmod.unescape(page)

          urls = re.findall(r'https://home\.mindworking\.eu/api/mediaData/[^"\'<>\\ ]+', page)
          candidates = []
          for url in urls:
              m = re.search(r'/mediaDataMediaPurposeId/([^/]+)/', url)
              if not m:
                  continue
              token = m.group(1)
              try:
                  raw = base64.b64decode(token + "=" * (-len(token) % 4)).decode("utf-8", "replace")
              except Exception:
                  continue
              if '"MediaPurposeId":14' in raw:
                  candidates.append(url)

          # Preserve order, remove duplicates.
          candidates = list(dict.fromkeys(candidates))
          if not candidates:
              raise SystemExit("No floorplan (MediaPurposeId 14) found in home.dk HTML")

          # Ask the source for a large un-cropped version. The image content itself is unchanged.
          url = candidates[0].split("?")[0] + "?quality=100&w=2000"
          print("Floorplan source:", url)
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          data = urllib.request.urlopen(req, timeout=30).read()
          if len(data) < 10000:
              raise SystemExit(f"Downloaded floorplan unexpectedly small: {len(data)} bytes")
          Path("floorplan.jpg").write_bytes(data)
          print("Downloaded", len(data), "bytes")
          PY

      - name: Commit floorplan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add floorplan.jpg
          git diff --cached --quiet || git commit -m "Add floorplan image from home.dk"
          git push
