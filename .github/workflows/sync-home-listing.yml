name: Sync home.dk listing

on:
  push:
    paths:
      - "scripts/sync_home.py"
      - ".github/workflows/sync-home-listing.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-home-listing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Sync listing data from home.dk
        run: python scripts/sync_home.py

      - name: Commit only when data changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git commit -m "Sync listing data from home.dk"
          git push
