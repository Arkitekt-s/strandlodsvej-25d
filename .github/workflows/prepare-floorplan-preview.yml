name: Prepare floorplan preview

on:
  push:
    paths:
      - floorplan.jpg
      - .github/workflows/prepare-floorplan-preview.yml

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Trim whitespace for a readable preview
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          im = Image.open("floorplan.jpg").convert("RGB")
          w,h=im.size
          # Skip the source image's corner compass and footer disclaimer.
          roi=(round(.15*w),round(.15*h),round(.85*w),round(.85*h))
          gray=ImageOps.grayscale(im.crop(roi))
          mask=gray.point(lambda v: 255 if v < 185 else 0)
          bounds=mask.getbbox()
          if not bounds:
              raise RuntimeError("No floorplan found in central region")
          left,top,right,bottom=(bounds[0]+roi[0],bounds[1]+roi[1],bounds[2]+roi[0],bounds[3]+roi[1])
          bw=right-left; bh=bottom-top
          if bw < w*.08 or bh < h*.08:
              raise RuntimeError("Candidate floorplan unexpectedly small")
          px=round(bw*.055); py=round(bh*.08)
          box=(max(0,left-px),max(0,top-py),min(w,right+px),min(h,bottom+py))
          preview=im.crop(box)
          preview.save("floorplan-preview.png",optimize=True)
          print(f"Original: {w}x{h}; detected floorplan: {(left,top,right,bottom)}; preview crop: {box}; preview: {preview.size}")
          PY
      - name: Commit only the new preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add floorplan-preview.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add whitespace-trimmed floorplan preview"
          git pull --rebase origin main
          git push
