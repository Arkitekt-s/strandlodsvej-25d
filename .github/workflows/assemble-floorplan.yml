name: Assemble floorplan image

on:
  push:
    paths:
      - ".tmp-floorplan/ready"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Assemble exact uploaded floorplan
        shell: bash
        run: |
          cat .tmp-floorplan/part-* | base64 --decode > floorplan.jpg
          test "$(wc -c < floorplan.jpg)" -eq 72443
          rm -rf .tmp-floorplan

      - name: Commit floorplan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add original floorplan image"
          git push
